name: Browser test environment
description: Python with the locked requirements, Playwright and a cached Chromium for the browser tests.

inputs:
  root:
    description: Checkout directory that holds the requirements and scripts
    default: .

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          ${{ inputs.root }}/requirements.txt
          ${{ inputs.root }}/requirements-test.txt

    # The system packages belong to the runner image; a new image starts a new cache.
    - name: Read the runner image
      id: runner-image
      shell: bash
      run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Cache the Playwright browser and its system packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-apt
        key: playwright-chromium-1.64.1-apt-lists-${{ runner.os }}-${{ steps.runner-image.outputs.version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        pip install --require-hashes -r requirements.txt
        pip install --require-hashes -r requirements-test.txt
        pip install pytest-playwright==0.7.2 playwright==1.64.1
        bash scripts/install_playwright_chromium.sh
