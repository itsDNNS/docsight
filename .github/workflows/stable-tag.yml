name: Publish Stable Tag

# Points :stable at the image of the newest v* release without rebuilding it,
# so :stable and the release tag share one digest. Release builds set :stable
# themselves; this covers the first rollout and repairs.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-stable-tag
  cancel-in-progress: false

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find newest release tag
        id: release
        run: |
          newest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [[ -z "$newest_tag" ]]; then
            echo "No v* release tag found" >&2
            exit 1
          fi
          echo "tag=$newest_tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Point stable at the release image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE:$TAG"
          release_digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}')"
          stable_digest="$(docker buildx imagetools inspect "$IMAGE:stable" --format '{{json .Manifest.Digest}}')"
          if [[ "$release_digest" != "$stable_digest" ]]; then
            echo "stable ($stable_digest) does not match $TAG ($release_digest)" >&2
            exit 1
          fi
          echo "$IMAGE:stable now points at $TAG ($release_digest)" >> "$GITHUB_STEP_SUMMARY"
