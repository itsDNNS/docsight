<!-- ═══ Panel: BNetzA (Module) ═══ -->
<div class="settings-module" id="block-mod-docsight_bnetz">
    <div class="card">
        <div class="card-header">
            <div class="card-title-group">
                <div class="card-icon">
                    <i data-lucide="file-check"></i>
                </div>
                <div>
                    <div class="card-title">{{ t['docsight.bnetz.bnetz_watcher_title'] }}</div>
                    <div class="card-subtitle">{{ t['docsight.bnetz.bnetz_watcher_desc'] }} <a class="card-help" href="https://github.com/itsDNNS/docsight/wiki/Configuration#bnetza-file-watcher" target="_blank" rel="noopener noreferrer">{{ t.settings_learn_more }}</a></div>
                </div>
            </div>
        </div>
        <div class="toggle-row">
            <div class="toggle-info">
                <span class="toggle-title" id="bnetz_watch_enabled-title">{{ t.enabled }}</span>
                <span class="toggle-desc">{{ t['docsight.bnetz.bnetz_watcher_hint'] }}</span>
            </div>
            <input type="hidden" name="bnetz_watch_enabled" value="false">
            <label class="toggle">
                <input type="checkbox" id="bnetz_watch_enabled" name="bnetz_watch_enabled" value="true" {% if config.bnetz_watch_enabled %}checked{% endif %} aria-labelledby="bnetz_watch_enabled-title">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="form-grid settings-gap">
            <div class="form-field">
                <label class="form-label" for="bnetz_watch_dir">{{ t['docsight.bnetz.bnetz_watch_dir_label'] }}</label>
                <input class="form-input" type="text" id="bnetz_watch_dir" name="bnetz_watch_dir" value="{{ config.bnetz_watch_dir }}" placeholder="/data/bnetz">
                <span class="form-hint">{{ t['docsight.bnetz.bnetz_watch_dir_hint'] }}</span>
            </div>
        </div>
        <span class="form-hint settings-note settings-note-aside">{{ t['docsight.bnetz.bnetz_docker_hint'] }}</span>
    </div>
</div>
