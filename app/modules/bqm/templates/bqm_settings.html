<!-- ═══ Panel: BQM (Module) ═══ -->
<div class="settings-module" id="block-mod-docsight_bqm">
    <div class="card">
        <div class="card-header">
            <div class="card-title-group">
                <div class="card-icon">
                    <i data-lucide="activity"></i>
                </div>
                <div>
                    <div class="card-title">ThinkBroadband BQM</div>
                    <div class="card-subtitle">{{ t['docsight.bqm.bqm_optional'] }} <a class="card-help" href="https://github.com/itsDNNS/docsight/wiki/Features-BQM#recommended-setup-csv-yesterday" target="_blank" rel="noopener noreferrer">{{ t.settings_learn_more }}</a></div>
                </div>
            </div>
        </div>
        <div class="form-grid">
            <div class="form-field">
                <label class="form-label" for="bqm_url">{{ t['docsight.bqm.bqm_share_url'] }}</label>
                <input class="form-input" type="url" id="bqm_url" name="bqm_url" value="{{ config.bqm_url }}" placeholder="https://www.thinkbroadband.com/broadband/monitoring/quality/share/...csv">
                <span class="form-hint">{{ t['docsight.bqm.bqm_url_hint'] }}</span>
                <span class="form-hint">{{ t['docsight.bqm.bqm_bulk_import_hint'] }}</span>
            </div>
            <div class="form-field">
                <label class="form-label" for="bqm_collect_time">{{ t['docsight.bqm.bqm_collect_time'] }}</label>
                <input class="form-input" type="time" id="bqm_collect_time" name="bqm_collect_time" value="{{ config.bqm_collect_time }}">
                <span class="form-hint">{{ t['docsight.bqm.bqm_collect_time_hint'] }}</span>
            </div>
        </div>
    </div>
</div>
