<!-- ═══ Panel: Reports (Module) ═══ -->
<div class="settings-module" id="block-mod-docsight_reports">
    <div class="card">
        <div class="card-header">
            <div class="card-title-group">
                <div class="card-icon">
                    <i data-lucide="file-text"></i>
                </div>
                <div>
                    <div class="card-title">{{ t['docsight.reports.report_settings_title'] }}</div>
                    <div class="card-subtitle">{{ t['docsight.reports.report_settings_hint'] }} <a class="card-help" href="https://github.com/itsDNNS/docsight/wiki/Filing-a-Complaint" target="_blank" rel="noopener noreferrer">{{ t.settings_learn_more }}</a></div>
                </div>
            </div>
        </div>

        <div class="form-grid cols-2">
            <div class="form-field">
                <label class="form-label" for="report_customer_name">{{ t['docsight.reports.report_name'] }}</label>
                <input class="form-input" type="text" id="report_customer_name" name="report_customer_name" value="{{ config.report_customer_name }}">
            </div>
            <div class="form-field">
                <label class="form-label" for="report_customer_number">{{ t['docsight.reports.report_customer_number'] }}</label>
                <input class="form-input" type="text" id="report_customer_number" name="report_customer_number" value="{{ config.report_customer_number }}">
            </div>
        </div>
        <div class="form-field settings-gap">
            <label class="form-label" for="report_customer_address">{{ t['docsight.reports.report_address'] }}</label>
            <textarea class="form-input" id="report_customer_address" name="report_customer_address" rows="3">{{ config.report_customer_address }}</textarea>
            <span class="form-hint">{{ t['docsight.reports.report_settings_privacy'] }}</span>
        </div>
    </div>
</div>
