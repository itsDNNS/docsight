<!-- ═══ Panel: Weather Module ═══ -->
<div class="settings-module" id="block-mod-docsight_weather">
    <div class="card">
        <div class="card-header">
            <div class="card-title-group">
                <div class="card-icon">
                    <i data-lucide="thermometer"></i>
                </div>
                <div>
                    <div class="card-title">{{ t['docsight.weather.weather_title'] }}</div>
                    <div class="card-subtitle">{{ t['docsight.weather.weather_optional'] }} <a class="card-help" href="https://github.com/itsDNNS/docsight/wiki/Features-Weather#setup" target="_blank" rel="noopener noreferrer">{{ t.settings_learn_more }}</a></div>
                </div>
            </div>
        </div>
        <div class="toggle-row">
            <div class="toggle-info">
                <span class="toggle-title" id="weather_enabled-title">{{ t['docsight.weather.weather_enable'] }}</span>
                <span class="toggle-desc">{{ t['docsight.weather.weather_enable_hint'] }}</span>
            </div>
            <input type="hidden" name="weather_enabled" value="false">
            <label class="toggle">
                <input type="checkbox" id="weather_enabled" name="weather_enabled" value="true" {% if config.weather_enabled %}checked{% endif %} aria-labelledby="weather_enabled-title">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="form-grid cols-2 settings-gap">
            <div class="form-field">
                <label class="form-label" for="weather_latitude">{{ t['docsight.weather.weather_latitude'] }}</label>
                <input class="form-input" type="text" id="weather_latitude" name="weather_latitude" value="{{ config.weather_latitude }}" placeholder="52.52">
                <span class="form-hint">{{ t['docsight.weather.weather_coord_hint'] }}</span>
            </div>
            <div class="form-field">
                <label class="form-label" for="weather_longitude">{{ t['docsight.weather.weather_longitude'] }}</label>
                <input class="form-input" type="text" id="weather_longitude" name="weather_longitude" value="{{ config.weather_longitude }}" placeholder="13.41">
            </div>
        </div>
    </div>
</div>
