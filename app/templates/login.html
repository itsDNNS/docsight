<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="{{ theme|default('dark') }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DOCSight - {{ t.login_title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#06080f">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css', v=version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css', v=version) }}">
    {% include 'partials/theme_vars.html' %}
    {% include 'partials/browser_url_bootstrap.html' %}
    {% include 'partials/theme_bootstrap.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css', v=version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shell.css', v=version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css', v=version) }}">
</head>
<body>
    {% include 'partials/brand_bar.html' %}
    <main class="login-layout">
        <section class="card login-card" aria-labelledby="login-title">
            <h1 class="login-title" id="login-title">{{ t.login_title }}</h1>
            <p class="login-hint">{{ t.login_hint }}</p>
            {% if error %}
            <div class="login-error" role="alert">{{ error }}</div>
            {% endif %}
            <form method="POST" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-field">
                    <label class="form-label" for="login-password">{{ t.password }}</label>
                    <input class="form-input" type="password" id="login-password" name="password" autocomplete="current-password" autofocus required>
                </div>
                <button type="submit" class="btn btn-primary login-submit">{{ t.login_button }}</button>
            </form>
        </section>
    </main>
</body>
</html>
