{#- What the colored bands behind power and SNR charts mean. Spans the chart grid's full width. -#}
<p class="chart-band-legend">
    <span class="chart-band-legend-title">{{ t.chart_bands_label }}</span>
    <span class="chart-band-legend-item"><span class="chart-band-swatch chart-band-good" aria-hidden="true"></span>{{ t.health_good }}</span>
    <span class="chart-band-legend-item"><span class="chart-band-swatch chart-band-tolerated" aria-hidden="true"></span>{{ t.health_tolerated }}</span>
    <span class="chart-band-legend-item"><span class="chart-band-swatch chart-band-marginal" aria-hidden="true"></span>{{ t.health_marginal }}</span>
    <span class="chart-band-legend-item"><span class="chart-band-swatch chart-band-critical" aria-hidden="true"></span>{{ t.health_critical }}</span>
</p>
