<div class="view-content fritz-cable-view">
    <div class="view-page-header fritz-cable-header">
        <div class="view-page-header-left">
            <h2 class="view-page-title fritz-cable-title">{{ t.seg_title }}</h2>
            <span class="view-page-subtitle fritz-cable-subtitle">{{ t.seg_subtitle }}</span>
        </div>
        <div class="view-page-actions">
            <div class="segmented" id="fritz-cable-range-tabs" role="group" aria-label="{{ t.time_range }}">
                <button class="segmented-option" data-range="24h" aria-pressed="false">{{ t.seg_range_24h }}</button>
                <button class="segmented-option" data-range="7d" aria-pressed="false">{{ t.seg_range_7d }}</button>
                <button class="segmented-option" data-range="30d" aria-pressed="false">{{ t.seg_range_30d }}</button>
                <button class="segmented-option active" data-range="all" aria-pressed="true">{{ t.seg_range_all }}</button>
            </div>
        </div>
    </div>

    <div id="fritz-cable-skeleton">
        <div class="fritz-cable-kpis">
            <div class="chart-card fritz-cable-kpi"><div class="skeleton fritz-cable-skel-label"></div><div class="skeleton fritz-cable-skel-value"></div><div class="skeleton fritz-cable-skel-caption"></div></div>
            <div class="chart-card fritz-cable-kpi"><div class="skeleton fritz-cable-skel-label"></div><div class="skeleton fritz-cable-skel-value"></div><div class="skeleton fritz-cable-skel-caption"></div></div>
            <div class="chart-card fritz-cable-kpi"><div class="skeleton fritz-cable-skel-label"></div><div class="skeleton fritz-cable-skel-value"></div><div class="skeleton fritz-cable-skel-caption"></div></div>
        </div>
        <div class="fritz-cable-grid">
            <div class="chart-card fritz-cable-panel"><div class="skeleton fritz-cable-skel-title"></div><div class="skeleton fritz-cable-skel-chart"></div></div>
            <div class="chart-card fritz-cable-panel"><div class="skeleton fritz-cable-skel-title"></div><div class="skeleton fritz-cable-skel-chart"></div></div>
        </div>
    </div>

    <div id="fritz-cable-message" class="view-empty" hidden></div>

    <div id="fritz-cable-content" hidden>
        <div class="fritz-cable-kpis">
            <div class="chart-card fritz-cable-kpi">
                <div class="fritz-cable-kpi-label">{{ t.seg_ds_total }}</div>
                <div class="fritz-cable-kpi-value" id="fritz-cable-ds-total">-</div>
                <div class="fritz-cable-kpi-sub" id="fritz-cable-ds-stats"></div>
            </div>
            <div class="chart-card fritz-cable-kpi">
                <div class="fritz-cable-kpi-label">{{ t.seg_us_total }}</div>
                <div class="fritz-cable-kpi-value" id="fritz-cable-us-total">-</div>
                <div class="fritz-cable-kpi-sub" id="fritz-cable-us-stats"></div>
            </div>
            <div class="chart-card fritz-cable-kpi">
                <div class="fritz-cable-kpi-label">{{ t.seg_status }}</div>
                <div class="fritz-cable-kpi-value" id="fritz-cable-status">-</div>
                <div class="fritz-cable-kpi-sub" id="fritz-cable-count"></div>
            </div>
        </div>

        <div class="fritz-cable-grid">
            <div class="chart-card fritz-cable-panel">
                <div class="fritz-cable-panel-title">{{ t.seg_downstream }}</div>
                <div id="fritz-cable-ds-chart"></div>
            </div>

            <div class="chart-card fritz-cable-panel">
                <div class="fritz-cable-panel-title">{{ t.seg_upstream }}</div>
                <div id="fritz-cable-us-chart"></div>
            </div>
        </div>

        <div class="chart-card fritz-cable-events" id="fritz-cable-events-card">
            <div class="fritz-cable-events-header">
                <div class="fritz-cable-panel-title">{{ t.seg_events_title }}</div>
                <div class="fritz-cable-events-meta" id="fritz-cable-events-meta"></div>
            </div>
            <div class="fritz-cable-events-subtitle">{{ t.seg_events_subtitle }}</div>
            <div class="fritz-cable-events-status" id="fritz-cable-events-status"></div>
            <ul class="fritz-cable-events-list" id="fritz-cable-events-list"></ul>
        </div>

        <div class="chart-card fritz-cable-note">
            {{ t.seg_note }}
        </div>
    </div>
</div>
